<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ночь в музее — конструктор посещения</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1 id="event-title">Ночь в музее</h1>
      <p class="event-date">15 ноября, 18:30</p>
      <p class="event-place">Музей космонавтики, проспект Мира, 111</p>
      <p class="event-description">Вечерняя программа с выставкой и экскурсиями</p>
      <button id="show-program" class="button" type="button">Показать программу</button>
      <div id="program" class="program" hidden></div>
    </section>

    <form id="service-form" class="service-form" hidden>
      <h2>Дополнительные услуги</h2>
      <div class="service">
        <input type="checkbox" id="guide" name="guide">
        <label for="guide">Экскурсия с гидом — 500 руб.</label>
      </div>
      <div class="service">
        <input type="checkbox" id="audio" name="audio">
        <label for="audio">Аудиогид — 350 руб.</label>
      </div>
      <div class="service">
        <input type="checkbox" id="catalog" name="catalog">
        <label for="catalog">Каталог выставки — 250 руб.</label>
      </div>
      <button class="button" type="submit">Рассчитать</button>
    </form>

    <p id="choice-error" class="error" hidden>Выберите хотя бы одну услугу.</p>
    <p id="data-error" class="error" hidden>Ошибка данных.</p>
    <div id="result" class="result" hidden></div>
    <pre id="report-json" class="report-json" hidden></pre>
  </main>

  <script src="app.js"></script>
</body>
</html>
